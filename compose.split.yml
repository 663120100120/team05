services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${TEAM_PORT:-8080}:80"
    depends_on:
      menu:
        condition: service_healthy
      order:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
    restart: unless-stopped

  menu:
    build: ./services/menu
    environment:
      ROOT_PATH: ${ROOT_PATH:-}
      DATABASE_URL: postgresql+psycopg://menu:menu@menu-db:5432/menu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    depends_on:
      menu-db:
        condition: service_healthy
    restart: unless-stopped

  order:
    build: ./services/order
    environment:
      ROOT_PATH: ${ROOT_PATH:-}
      MENU_URL: http://menu:8000/
      DATABASE_URL: postgresql+psycopg://order:order@order-db:5432/order
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    depends_on:
      order-db:
        condition: service_healthy
      menu:
        condition: service_started
    restart: unless-stopped

  menu-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menu
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
    volumes:
      - menu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "menu", "-d", "menu"]
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "order", "-d", "order"]
    restart: unless-stopped

  locust:
    profiles: [loadtest]
    image: locustio/locust:2.15.1
    ports:
      - "8089:8089"
    volumes:
      - ./loadtest:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://gateway
    depends_on:
      - gateway

volumes:
  menu-db-data:
  order-db-data: